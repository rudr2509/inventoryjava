<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>New purchase request</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="container narrow"><h1>Submit purchase request</h1><form class="panel formgrid" action="/requests/save" method="post"><label>Product</label><select name="productId" required><option th:each="p:${products}" th:value="${p.id}" th:text="${p.name+' (stock: '+p.quantity+')'}"></option></select><label>Supplier</label><select name="supplierId"><option value="">Not specified</option><option th:each="s:${suppliers}" th:value="${s.id}" th:text="${s.name}"></option></select><label>Quantity required</label><input type="number" name="quantity" min="1" required><label>Reason</label><textarea name="reason" required placeholder="Explain why this purchase is needed"></textarea><button class="primary">Submit request</button></form></main></body></html>
