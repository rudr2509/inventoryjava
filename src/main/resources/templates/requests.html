<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Purchase requests</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="container"><div class="heading"><h1>Purchase requests</h1><a class="primary" href="/requests/new">+ Submit request</a></div><div class="success" th:if="${message}" th:text="${message}"></div><div class="alert" th:if="${error}" th:text="${error}"></div><table><tr><th>ID</th><th>Product</th><th>Supplier</th><th>Qty</th><th>Reason</th><th>By</th><th>Status</th><th th:if="${admin}">Review</th></tr><tr th:each="r:${requests}"><td th:text="${r.id}"></td><td th:text="${r.product.name}"></td><td th:text="${r.supplier != null ? r.supplier.name : '-'}"></td><td th:text="${r.quantity}"></td><td th:text="${r.reason}"></td><td th:text="${r.requestedBy}"></td><td><span class="status" th:text="${r.status}"></span></td><td th:if="${admin}"><form th:if="${r.status=='PENDING'}" th:action="@{/requests/{id}/review(id=${r.id})}" method="post"><input name="note" placeholder="Optional note"><button class="approve" name="decision" value="APPROVED">Approve</button><button class="dangerbtn" name="decision" value="REJECTED">Reject</button></form><span th:if="${r.status!='PENDING'}">Reviewed</span></td></tr></table></main></body></html>
