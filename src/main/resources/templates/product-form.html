<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Product</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="container narrow"><h1>Product details</h1><form class="panel formgrid" th:object="${product}" th:action="@{/products/save}" method="post"><input type="hidden" th:field="*{id}"><label>Name</label><input th:field="*{name}" required><label>SKU</label><input th:field="*{sku}"><label>Category</label><input th:field="*{category}"><label>Quantity</label><input type="number" min="0" th:field="*{quantity}" required><label>Reorder level</label><input type="number" min="0" th:field="*{reorderLevel}" required><label>Unit price</label><input type="number" min="0" step=".01" th:field="*{unitPrice}" required><button class="primary">Save product</button><a href="/products">Cancel</a></form></main></body></html>
