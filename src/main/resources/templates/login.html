
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login | InventoryPro</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body class="loginbg">

<main class="login">

    <h1>InventoryPro</h1>
    <p>Inventory Purchase Request Management</p>

    <div class="alert" th:if="${param.error}">
        Invalid username or password
    </div>

    <div class="success" th:if="${param.logout}">
        You have logged out successfully
    </div>

    <form method="post" th:action="@{/login}">

        <label>Username</label>
        <input type="text" name="username"
               placeholder="Enter username"
               required autofocus>

        <label>Password</label>
        <input type="password" name="password"
               placeholder="Enter password"
               required>

        <button type="submit" class="primary full">
            Sign in
        </button>

    </form>

    <small>
        Admin: admin / Admin@123<br>
        Employee: employee / Employee@123
    </small>

</main>

</body>
</html>
