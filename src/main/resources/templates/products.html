<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Products</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="container"><div class="heading"><h1>Products</h1><a class="primary" href="/products/new">+ Add product</a></div><div class="success" th:if="${message}" th:text="${message}"></div><table><tr><th>Name</th><th>SKU</th><th>Category</th><th>Quantity</th><th>Unit price</th><th>Actions</th></tr><tr th:each="p:${products}"><td th:text="${p.name}"></td><td th:text="${p.sku}"></td><td th:text="${p.category}"></td><td th:text="${p.quantity}"></td><td th:text="${p.unitPrice}"></td><td><a th:href="@{/products/{id}/edit(id=${p.id})}">Edit</a><form class="inline" th:action="@{/products/{id}/delete(id=${p.id})}" method="post"><button class="dangerbtn">Delete</button></form></td></tr></table></main></body></html>
