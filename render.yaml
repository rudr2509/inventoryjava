databases:
  - name: inventorypro-db
    databaseName: inventorypro
    user: inventorypro_user
    plan: free

services:
  - type: web
    name: inventorypro
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: inventorypro-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: inventorypro-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: inventorypro-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: inventorypro-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: inventorypro-db
          property: password
